<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/icons/favicon-32x32.png">
    <link rel="preload" href="assets/fonts/kumbh-sans-v27-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/kumbh-sans-v27-latin-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <title>Frontend Mentor | E-commerce product page</title>
  </head>

  <body>
    <header class="header">
      <div class="header__left--container">
        <button type="button" class="nav__toggle" id="menuBtn" aria-label="Toggle menu" aria-expanded="false" aria-controls="menuOverlay">
          <span class="nav__toggle--bar"></span>
          <span class="nav__toggle--bar"></span>
          <span class="nav__toggle--bar"></span>
        </button>
        <div class="header__logo--container">
          <a href="#" class="logo">
            <img class="header__logo--image" src="assets/images/icons/logo.svg" alt="Company logo" width="65" height="40">
          </a>
        </div>

        <div class="backdrop" id="backdrop" aria-hidden="true"></div>
        
        <div class="nav__drawer" id="menuOverlay" aria-hidden="true">
          <nav class="nav__links" aria-label="Header navigation">
            <ul class="nav__links--group">
              <li><a href="#" class="nav__links--link">Collections</a></li>
              <li><a href="#" class="nav__links--link">Men</a></li>
              <li><a href="#" class="nav__links--link">Women</a></li>
              <li><a href="#" class="nav__links--link">About</a></li>
              <li><a href="#" class="nav__links--link">Contact</a></li>
            </ul>       
          </nav>
        </div>
      </div>

      <div class="header__right--container">
        <button type="button" class="header__cart--btn" aria-label="Open cart" aria-expanded="false" aria-controls="cartModal">
          
          <span class="header__cart--icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="9" cy="21" r="1" fill="currentColor"/>
              <circle cx="20" cy="21" r="1" fill="currentColor"/>
            </svg>
          </span>
        
          <span class="header__cart--badge hidden" aria-live="polite"></span>
        </button>
        <button type="button" class="user__avatar--btn" aria-label="Account">
          <img class="user__avatar" src="assets/images/avatar/image-avatar.png" alt="User avatar" width="100" height="100">
        </button>
      </div>
    </header>

    <div id="cartModal" class="cart__modal" role="dialog" aria-label="Shopping cart" aria-hidden="true" aria-modal="true">
      <p class="cart__modal--title">Cart</p>
      <div class="cart__modal--body"></div>
    </div>

    <main class="main__product--page">
      <section class="gallery">
        <div class="gallery__main">
          <img class="gallery__active--image" alt="" width="1000" height="1000">
          <button type="button" class="gallery__btn--prev" aria-label="Previous image">
            <img src="assets/images/icons/icon-previous.svg" alt="">
          </button>
          <button type="button" class="gallery__btn--next" aria-label="Next image">
            <img src="assets/images/icons/icon-next.svg" alt="">
          </button>
        </div>
        <ul class="gallery__thumbnails"></ul>
      </section>

      <section class="product__info">
        <p class="brand"></p>
        <h1 class="product__title"></h1>
        <p class="description"></p>
        <div class="pricing">
          <div class="promo">
            <span class="sales__price"></span>
            <span class="discount__badge"></span>
          </div>
          <span class="original__price"></span>
        </div>
        <div class="quantity__cart">
          <div class="stepper">
            <button type="button" class="stepper__minus" aria-label="Decrease quantity"><img src="assets/images/icons/icon-minus.svg" alt=""></button>
            <span class="stepper__count" aria-live="polite"></span>
            <button type="button" class="stepper__plus" aria-label="Increase quantity"><img src="assets/images/icons/icon-plus.svg" alt=""></button>
          </div>
          
          <button type="button" class="cart__btn" id="addToCartBtn">
            <span class="cart__btn--icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="9" cy="21" r="1" fill="currentColor"/>
                <circle cx="20" cy="21" r="1" fill="currentColor"/>
              </svg>
            </span>
            Add to Cart
          </button>
        </div>
      </section>
    </main>

    <div class="lightbox hidden" role="dialog" aria-label="Product image lightbox" aria-modal="true" aria-hidden="true" inert="">
      <div class="lightbox__inner">

        <div class="lightbox__image--wrapper">

          <button type="button" class="lightbox__close--btn" aria-label="Close lightbox">
            <svg class="lightbox__close--icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 6L6 18M6 6L18 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          
          <img class="lightbox__active--image" alt="">

          <button type="button" class="lightbox__btn--prev" aria-label="Previous image">
            <img src="assets/images/icons/icon-previous.svg" alt="">
          </button>
          <button type="button" class="lightbox__btn--next" aria-label="Next image">
            <img src="assets/images/icons/icon-next.svg" alt="">
          </button>
        </div>

        <ul class="lightbox__thumbnails"></ul>
      </div>
    </div>
  </body>
</html>
